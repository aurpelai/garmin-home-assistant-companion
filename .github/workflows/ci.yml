name: CI

# Two verification gates, both surfacing a check on the PR:
#   test-build — type-checks production sources + the (:test) suite with the
#     Monkey C compiler at strict level (-l 3 -w, warnings = failure) across
#     every device targeted by manifest.xml. The matco/connectiq-tester image
#     supplies the SDK and the credential-gated device files.
#   test-run   — runs the (:test) suite in the headless simulator to catch
#     wrong expected values a compile can't.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  devices:
    name: Derive device matrix from manifest.xml
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse product ids into a JSON array
        id: list
        # manifest.xml is the single source of truth for targeted devices, so
        # the matrix is derived from it rather than hand-picked, keeping the
        # two from drifting apart.
        run: |
          list=$(grep -oE 'iq:product id="[^"]+"' manifest.xml | sed -E 's/.*id="([^"]+)".*/\1/' | jq -R -s -c 'split("\n") | map(select(length>0))')

          # An empty list would expand to zero build jobs and let CI pass
          # having compiled nothing — the silent gate this whole check exists
          # to prevent. Fail loudly instead if the manifest parses to nothing.
          if [ "$list" = "[]" ]; then
            echo "No products parsed from manifest.xml" >&2
            exit 1
          fi

          # A monkey.jungle "<id>.resourcePath" line for a device the manifest
          # no longer lists is dead config nothing else surfaces: the line is
          # additive so it doesn't break the build, and the matrix is manifest-
          # driven so it never builds that device. Assert the jungle ids are a
          # subset of the manifest ids to catch such an orphan here. The reverse
          # (a manifest device with no jungle line) builds fine off base
          # resources and is deliberately not checked.
          manifest_ids=$(printf '%s' "$list" | jq -r '.[]' | sort)
          jungle_ids=$(grep -oE '^[A-Za-z0-9]+\.resourcePath' monkey.jungle | sed -E 's/\.resourcePath$//' | grep -vx base | sort)

          orphans=$(comm -23 <(printf '%s\n' "$jungle_ids") <(printf '%s\n' "$manifest_ids"))
          if [ -n "$orphans" ]; then
            echo "These monkey.jungle device ids are not present in manifest.xml (orphaned resourcePath lines):" >&2
            printf '  %s\n' $orphans >&2
            exit 1
          fi

          echo "list=$list" >> "$GITHUB_OUTPUT"

  test-build:
    name: Type-check (${{ matrix.device }})
    needs: devices
    runs-on: ubuntu-latest
    container:
      # ghcr.io/matco/connectiq-tester:v2.8.0 — pinned by digest for
      # immutability. Bundles Connect IQ SDK 9.2.0. Bump the digest (and the
      # tag comment) deliberately when adopting a newer SDK / device snapshot.
      image: ghcr.io/matco/connectiq-tester@sha256:7a6f586cb0e0393ff288da09cf27b6dad40a0058a346c529b99fd0fc19858f0f
    strategy:
      fail-fast: false
      matrix:
        # Every device targeted by manifest.xml, so resource resolution and
        # per-device builds are all exercised.
        device: ${{ fromJSON(needs.devices.outputs.list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate ephemeral developer key
        # Test builds are never shipped, so a throwaway key is sufficient.
        run: openssl genrsa -out developer_key.pem 4096 && openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key.pem -out developer_key.der -nocrypt

      - name: Type-check with --unit-test (strict, warnings = failure)
        # monkeyc exits 0 even when it prints WARNING lines, so the warnings
        # have to be grepped out of the captured output and turned into an
        # explicit failure.
        run: |
          mkdir -p bin

          out=$(monkeyc \
            -d ${{ matrix.device }} \
            -f "monkey.jungle;test.jungle" \
            -o bin/test_${{ matrix.device }}.prg \
            -y developer_key.der \
            -l 3 -w --unit-test 2>&1)

          echo "$out"

          if echo "$out" | grep -qE '^WARNING'; then
            echo "FAIL: compiler warnings present"
            exit 1
          fi

  test-run:
    name: Run tests (fenix8solar51mm)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      # matco's action is unusable here: its compile step hardcodes
      # `-f monkey.jungle`, so test.jungle can never be layered on.
      image: ghcr.io/matco/connectiq-tester@sha256:7a6f586cb0e0393ff288da09cf27b6dad40a0058a346c529b99fd0fc19858f0f
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate ephemeral developer key
        # Test builds are never shipped, so a throwaway key is sufficient.
        run: openssl genrsa -out developer_key.pem 4096 && openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key.pem -out developer_key.der -nocrypt

      - name: Run the suite in the headless simulator
        # monkeydo exits nonzero even when every test passes, so the last line
        # is the verdict. A simulator that never ran leaves no summary at all,
        # which fails the same check rather than reading as clean.
        run: |
          mkdir -p bin

          monkeyc \
            -f "monkey.jungle;test.jungle" \
            -d fenix8solar51mm \
            -o bin/test.prg \
            -y developer_key.der \
            -t -l 3

          # The simulator needs the device files in root's home, which GitHub
          # overrides for Docker actions but not for container: steps.
          export HOME=/root
          export DISPLAY=:1

          # Xvfb and the simulator outlive the step otherwise, leaving the job
          # to stall on orphaned children rather than finishing.
          trap 'kill $(jobs -p)' EXIT

          Xvfb "$DISPLAY" -screen 0 1280x1024x24 &
          simulator > /dev/null 2>&1 &

          sleep 5

          monkeydo bin/test.prg fenix8solar51mm -t > /tmp/result.txt
          cat /tmp/result.txt

          [[ "$(tail -1 /tmp/result.txt)" == PASSED* ]]

  boot-smoke:
    name: Boot smoke (fenix8solar51mm)
    runs-on: ubuntu-latest
    # A whole-job cap so a wedged simulator fails fast instead of stalling to
    # the runner default.
    timeout-minutes: 5
    container:
      # matco's action only runs the unit-test suite (-t) and can't boot an app.
      image: ghcr.io/matco/connectiq-tester@sha256:7a6f586cb0e0393ff288da09cf27b6dad40a0058a346c529b99fd0fc19858f0f
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate ephemeral developer key
        # Test builds are never shipped, so a throwaway key is sufficient.
        run: openssl genrsa -out developer_key.pem 4096 && openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key.pem -out developer_key.der -nocrypt

      - name: Boot the app and check for a startup crash
        # One device only: the startup path is device-agnostic, so a single
        # device exercises it, and runtime cost scales per-device while the
        # value of repeating it doesn't. No settings are configured in CI, so
        # the app deterministically lands on its no-config error screen —
        # still exercising the full boot path.
        #
        # A healthy boot is silent, so there's nothing positive to grep for.
        # Two signals decide the result. A crash: the runtime prints a report
        # ending in the literal line "Encountered an app crash.", and the
        # crash ends monkeydo's session so its process exits. So a clean boot
        # is "no crash marker AND monkeydo still running on the error screen".
        # If monkeydo instead died leaving no marker, the harness never really
        # ran the app (Xvfb/simulator/sideload failure) — that is an infra
        # failure, not a pass, and must fail loudly rather than read as clean.
        # monkeydo's exit code is unusable either way (0 on clean boot and on
        # crash), so process liveness, not exit code, is the signal.
        run: |
          mkdir -p bin

          if ! monkeyc \
            -f monkey.jungle \
            -d fenix8solar51mm \
            -o bin/app.prg \
            -y developer_key.der \
            -l 3 -w
          then
            echo "FAIL: build did not produce an app to boot"
            exit 1
          fi

          export DISPLAY=:1
          Xvfb "$DISPLAY" -screen 0 1280x1024x24 &
          xvfb_pid=$!

          simulator > /dev/null 2>&1 &
          sim_pid=$!

          trap 'kill "$xvfb_pid" "$sim_pid" "$do_pid" 2>/dev/null' EXIT

          sleep 5

          monkeydo bin/app.prg fenix8solar51mm > /tmp/boot.txt 2>&1 &
          do_pid=$!

          # Poll rather than sleep-then-check once: a crash may surface at any
          # point in the window, so decide the moment either signal fires — the
          # marker appears, or the run's process exits — instead of racing a
          # single check against an arbitrary instant. Surviving the whole
          # window with the process still alive is the clean boot.
          for _ in $(seq 1 20); do
            if grep -qF 'Encountered an app crash.' /tmp/boot.txt; then
              echo "--- captured boot output ---"
              cat /tmp/boot.txt
              echo "FAIL: app crashed during startup"
              exit 1
            fi

            if ! kill -0 "$do_pid" 2>/dev/null; then
              echo "--- captured boot output ---"
              cat /tmp/boot.txt

              # The writer has exited, so the file is now fully flushed —
              # re-grep before blaming infra, in case a crash report landed
              # only as the session tore down.
              if grep -qF 'Encountered an app crash.' /tmp/boot.txt; then
                echo "FAIL: app crashed during startup"
                exit 1
              fi

              echo "FAIL: app run ended with no crash marker — the simulator or app launch did not run as expected, so a clean boot was not actually observed"
              exit 1
            fi

            sleep 1
          done

          echo "--- captured boot output ---"
          cat /tmp/boot.txt
          echo "OK: app booted and stayed running with no crash"

          echo "OK: app booted and is still running with no crash"
