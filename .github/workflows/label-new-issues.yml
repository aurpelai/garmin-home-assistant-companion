name: Label new issues

# Every newly opened issue starts life unvetted, so it gets `unconfirmed`. A human
# removes the label once they've confirmed the ticket.
#
# Spec tickets are the exception: a `Spec: …` title means the issue is a spec artifact
# for a design that's already settled (see WAYS-OF-WORKING.md), so it gets `spec`
# instead of `unconfirmed`.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label the new issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.html_url }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$TITLE" == Spec:* ]]; then
            gh issue edit "$ISSUE" --add-label spec
          else
            gh issue edit "$ISSUE" --add-label unconfirmed
          fi
