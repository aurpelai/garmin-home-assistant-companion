name: Release

# The release itself is cut locally with `make release` (changie batch + merge,
# APP_VERSION sync, one `Release vX.Y.Z` commit + tag) and pushed by hand. This
# workflow does the one step that must touch GitHub: turning the pushed tag into
# a GitHub Release, with the body taken from changie's per-version notes file.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file ".changes/${GITHUB_REF_NAME}.md"
